name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/export-legacy-db -> tools/export-legacy-db/target

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path tools/export-legacy-db/Cargo.toml -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Check legacy exporter
        run: cargo check --manifest-path tools/export-legacy-db/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Clippy on legacy exporter
        run: cargo clippy --manifest-path tools/export-legacy-db/Cargo.toml --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build release
        run: cargo build --workspace --release --locked

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Audit application dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          ignore: RUSTSEC-2023-0071
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit legacy exporter dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: tools/export-legacy-db
