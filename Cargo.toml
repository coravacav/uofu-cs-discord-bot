[workspace]
resolver = "2"
members = ["bot", "bot-lib", "bot-traits"]
exclude = ["tools/export-legacy-db"]

[profile.release]
debug = 0

[workspace.dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "rt-multi-thread",
] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "parking_lot",
] }
color-eyre = "0.6"
poise = { version = "0.6.2", default-features = false, features = [
    "cache",
    "chrono",
    "handle_panics",
] }
serenity = { version = "0.12.5", default-features = false, features = [
    "native_tls_backend",
] }
tracing = "0.1"
bot-lib = { path = 'bot-lib' }
bot-traits = { path = 'bot-traits' }
rand = "0.10"
serde = { version = "1", default-features = false, features = ["derive", "rc"] }
itertools = "0.14"
notify = "8"
rustc-hash = "2"

[workspace.lints.rust]
async_fn_in_trait = "allow"
unsafe_code = "forbid"

[profile.dev.package.poise]
hint-mostly-unused = true

[profile.release.package.poise]
hint-mostly-unused = true

[profile.dev.package.serenity]
hint-mostly-unused = true

[profile.release.package.serenity]
hint-mostly-unused = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
